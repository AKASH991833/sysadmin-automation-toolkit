name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck
        run: shellcheck -S error -x sysops lib/*.sh tests/run.sh
      - name: Test-suite as real root (user tests use a fake root filesystem)
        run: sudo ./tests/run.sh
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real useradd/usermod/userdel on the runner
        run: |
          printf 'username,fullname,groups,shell,sudo,ssh_public_key,expires\nciuser,CI User,,/bin/bash,no,,\n' > /tmp/u.csv
          sudo ./sysops user sync /tmp/u.csv --apply
          getent passwd ciuser
          sudo ./sysops user offboard ciuser --apply
          sudo ./sysops user delete ciuser --apply
          ! getent passwd ciuser
      - run: ./sysops health --format md || true
      - run: sudo ./sysops user audit
  rhel-family:
    # Same checks across the Red Hat family: Rocky, AlmaLinux, CentOS Stream, Fedora,
    # and Red Hat UBI 9 (the free official Red Hat image - not a RHEL subscription).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky-9, alma-9, centos-stream-9, fedora-latest, ubi-9]
        include:
          - {distro: rocky-9,          image: rockylinux:9}
          - {distro: alma-9,           image: almalinux:9}
          - {distro: centos-stream-9,  image: quay.io/centos/centos:stream9}
          - {distro: fedora-latest,    image: fedora:latest}
          - {distro: ubi-9,            image: registry.access.redhat.com/ubi9/ubi:latest}
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies (dnf)
        run: dnf install -y -q git bash diffutils findutils procps-ng gawk sed grep util-linux shadow-utils tar gzip openssl hostname iproute which
      - uses: actions/checkout@v4
      - name: Test suite on ${{ matrix.distro }}
        run: tests/run.sh
  live-rhel-family:
    # Real useradd/offboard/delete on each RHEL-family distro - exercises the "wheel"
    # sudo-group path that differs from Debian/Ubuntu.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky-9, alma-9, centos-stream-9, fedora-latest, ubi-9]
        include:
          - {distro: rocky-9,          image: rockylinux:9}
          - {distro: alma-9,           image: almalinux:9}
          - {distro: centos-stream-9,  image: quay.io/centos/centos:stream9}
          - {distro: fedora-latest,    image: fedora:latest}
          - {distro: ubi-9,            image: registry.access.redhat.com/ubi9/ubi:latest}
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies (dnf)
        run: dnf install -y -q git bash diffutils findutils procps-ng gawk sed grep util-linux shadow-utils tar gzip openssl hostname iproute which
      - uses: actions/checkout@v4
      - name: Real user sync/offboard/delete on ${{ matrix.distro }} (wheel group path)
        run: |
          printf 'username,fullname,groups,shell,sudo,ssh_public_key,expires\nciuser,CI User,,/bin/bash,yes,,\n' > /tmp/u.csv
          ./sysops user sync /tmp/u.csv --apply
          getent passwd ciuser
          id ciuser | grep -q wheel          # sudo: yes must map to wheel on RHEL-family
          ./sysops user offboard ciuser --apply
          ./sysops user delete ciuser --apply
          ! getent passwd ciuser

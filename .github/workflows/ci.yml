name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck
        run: shellcheck -S error -x sysops lib/*.sh tests/run.sh
      - name: Test-suite as real root (user tests use a fake root filesystem)
        run: sudo ./tests/run.sh
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real useradd/usermod/userdel on the runner
        run: |
          printf 'username,fullname,groups,shell,sudo,ssh_public_key,expires\nciuser,CI User,,/bin/bash,no,,\n' > /tmp/u.csv
          sudo ./sysops user sync /tmp/u.csv --apply
          getent passwd ciuser
          sudo ./sysops user offboard ciuser --apply
          sudo ./sysops user delete ciuser --apply
          ! getent passwd ciuser
      - run: ./sysops health --format md || true
      - run: sudo ./sysops user audit
  rocky:
    # Same suite on a RHEL-family distro: Rocky Linux 9 in a container (runs as root).
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install test dependencies (dnf)
        run: dnf install -y -q git bash coreutils findutils procps-ng gawk sed grep util-linux shadow-utils tar gzip openssl hostname iproute which
      - uses: actions/checkout@v4
      - name: Test suite on Rocky 9
        run: tests/run.sh
  live-rocky:
    # Real useradd/offboard/delete on Rocky 9 - exercises the RHEL "wheel" sudo-group path.
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install dependencies (dnf)
        run: dnf install -y -q git bash coreutils findutils procps-ng gawk sed grep util-linux shadow-utils tar gzip openssl hostname iproute which
      - uses: actions/checkout@v4
      - name: Real user sync/offboard/delete on Rocky (wheel group path)
        run: |
          printf 'username,fullname,groups,shell,sudo,ssh_public_key,expires\nciuser,CI User,,/bin/bash,yes,,\n' > /tmp/u.csv
          ./sysops user sync /tmp/u.csv --apply
          getent passwd ciuser
          id ciuser | grep -q wheel          # sudo: yes must map to wheel on RHEL-family
          ./sysops user offboard ciuser --apply
          ./sysops user delete ciuser --apply
          ! getent passwd ciuser

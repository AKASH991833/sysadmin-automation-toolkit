# name | timeout (seconds) | command
disk-report   | 60   | /opt/sysops/sysops health --format md > /var/log/sysops-health.md
log-cleanup   | 300  | /opt/sysops/sysops logs clean --dir /var/log/myapp --compress-after 7 --delete-after 30 --apply
backup-etc    | 1800 | /opt/sysops/sysops backup run --name etc --src "/etc /home" --dest /var/backups/sysops --keep-chains 3
user-sync     | 120  | /opt/sysops/sysops user sync /etc/sysops/users.csv --apply --prune
